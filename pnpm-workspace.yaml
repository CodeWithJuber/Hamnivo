packages:
  - apps/*
  - packages/*
  - examples/*

# pnpm 10 blocks dependency lifecycle scripts unless listed here.
onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@node-rs/argon2"
  - "@swc/core"
  - esbuild
  - sharp
  - protobufjs
  - msw

# Optional native accelerator for BullMQ's msgpack; the pure JS fallback is used.
ignoredBuiltDependencies:
  - msgpackr-extract

catalog:
  typescript: 6.0.3
  vitest: 5.0.2
  zod: 4.6.7
  "@types/node": 24.19.0

# Security fixes for packages that come in through others, at their patched versions
# (pnpm audit --prod, 2026-11-21). Drop an entry once the package that brings it in moves past it.
overrides:
  "seroval@<1.6.8": 1.6.12
  "undici@>=7.0.0 <7.30.1": 7.30.2
  "undici@>=8.0.0 <8.12.2": 8.13.1
  "zod@>=4.0.0 <4.6.6": 4.6.7
  "sharp@<0.35.5": 0.35.5
  "body-parser@>=2.0.0 <2.4.0": 2.4.0
  "source-map-js@>=1.0.0 <1.2.2": 1.2.4

# openapi-typescript 7.13 (latest) still declares TypeScript 5; its generator runs unchanged on
# TypeScript 6 and `pnpm --filter @hamnivo/chatwoot test` fails if the output drifts.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"

# sharp 0.35.5 (above) brings @emnapi/runtime 2.0.0-beta.2 for its WebAssembly fallback. pnpm then
# gave that beta to astro check's compiler binding as its peer, and astro check failed with
# "bridge.deleteEnv is not a function". Its language server now brings the stable runtime itself.
packageExtensions:
  "@astrojs/language-server@2":
    dependencies:
      "@emnapi/runtime": 1.11.3
