packages:
  - apps/*
  - packages/*
  - examples/*

# pnpm 10 blocks dependency lifecycle scripts unless listed here.
onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@node-rs/argon2"
  - "@swc/core"
  - esbuild
  - sharp
  - protobufjs
  - msw

# Optional native accelerator for BullMQ's msgpack; the pure JS fallback is used.
ignoredBuiltDependencies:
  - msgpackr-extract

catalog:
  typescript: 6.0.3
  vitest: 5.0.2
  zod: 4.6.5
  "@types/node": 24.19.0
