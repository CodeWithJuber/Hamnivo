# OpenSSF Scorecard: rates the repository's supply-chain practices (pinned actions, token
# permissions, branch protection, reviews...) and publishes the result, so the badge and
# https://scorecard.dev can show it. Findings appear under Security → Code scanning.
# Scorecard accepts a published result only from a workflow like this one: no top-level env or
# defaults, no write permission outside the job, and only checkout, Scorecard and the upload steps.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '27 5 * * 1'

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      # Upload the findings to code scanning.
      security-events: write
      # Publish the result, signed with the run's identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
