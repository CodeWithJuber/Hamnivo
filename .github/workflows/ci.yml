# The full check pipeline (ADR 0009): the same `pnpm ci:local` a server runs, split into suites that
# run side by side, one job each, on our own runners (deploy/ci-runner). On main and on a run by hand
# it covers every PostgreSQL major and the production and automatic-deploy smoke tests; on other
# branches PostgreSQL 18 (production's) only, and the smoke tests only when a deploy file changes.
# A push of a tree that an earlier run already passed (a branch merged into main, say) is not
# checked again: main then runs only PostgreSQL 16 and the smoke tests, other branches nothing.
# It uses nothing GitHub bills for (ADR 0020): dependencies are cached on the runner's disk, and each
# report is kept there as a file, never uploaded as an artifact. scripts/ci/no-github-billing.sh
# checks this.
name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same branch replaces a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Pick the suites
    runs-on: [self-hosted, linux, x64, hamnivo]
    timeout-minutes: 10
    # skip-duplicate-actions reads the earlier runs of this workflow.
    permissions:
      actions: read
      contents: read
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
    steps:
      # should_skip is true when an earlier run of this workflow passed on the same tree. If the
      # action fails, it is not true, and every suite runs.
      - name: Look for a passed run of the same tree
        id: duplicate
        continue-on-error: true
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the suites
        id: pick
        env:
          FULL: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          PASSED: ${{ steps.duplicate.outputs.should_skip }}
        run: |
          pg='18'
          smoke=false
          every=true # the suites every run has, whatever changed
          if [[ "$FULL" == true ]]; then
            pg='16 18'
            smoke=true
          elif ! changed="$(git diff --name-only "origin/main...$GITHUB_SHA")"; then
            smoke=true # No merge base to compare with: run the smoke tests rather than skip them.
          elif grep -Eq '^(deploy/|scripts/ci/(production|autodeploy)-smoke\.sh$|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            smoke=true
          fi
          # A push of a tree that already passed: main runs only what a branch run does not always
          # run, other branches nothing. A run by hand runs everything.
          if [[ "$PASSED" == true && "$GITHUB_EVENT_NAME" == push ]]; then
            every=false
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then pg='16'; else pg=''; smoke=false; fi
          fi
          suites=''
          suite() { # suite ID NAME ARGS PG BROWSERS
            suites+="${suites:+,}$(printf '{"id":"%s","name":"%s","args":"%s","pg":"%s","browsers":%s}' "$@")"
          }
          # The options that turn off every part of `pnpm ci:local` but the one named (all, if none).
          only() {
            local name
            for name in basics integration chatwoot a11y widget studio site; do
              [[ "$name" == "${1:-}" ]] || printf -- '--skip-%s ' "$name"
            done
          }
          # Slowest first: when suites outnumber runners, the runners take them in this order.
          if [[ "$every" == true ]]; then
            # Studio's 124 browser tests run on one worker, about 34 minutes: three parts instead.
            for part in 1 2 3; do
              suite "studio-$part" "Studio in a browser (part $part of 3)" "$(only studio)--shard=$part/3" '' true
            done
            suite widget 'Widget journey in a browser' "$(only widget)" '' true
          fi
          if [[ "$smoke" == true ]]; then
            suite autodeploy-smoke 'Automatic deploy smoke test' "$(only)--with-autodeploy" '' false
            suite production-smoke 'Production deployment smoke test' "$(only)--with-production" '' true
          fi
          # Each PostgreSQL version's integration tests in three parts, each with its own database.
          for version in $pg; do
            for part in 1 2 3; do
              suite "integration-pg$version-$part" "Integration tests (PostgreSQL $version, part $part of 3)" \
                "$(only integration)--shard=$part/3" "$version" false
            done
          done
          if [[ "$every" == true ]]; then
            suite basics 'Lint, types and unit tests' '--quick' '' false
            suite chatwoot 'Chatwoot contract suite' "$(only chatwoot)" '' false
            suite accessibility 'Accessibility audit' "$(only a11y)" '' true
            suite website 'Website in a browser' "$(only site)" '' true
          fi
          echo "suites=[$suites]" >> "$GITHUB_OUTPUT"
          echo "Suites: [$suites]"

  checks:
    name: ${{ matrix.name }}
    needs: plan
    # A push of a tree that already passed can leave no suite, and an empty matrix is an error.
    if: needs.plan.outputs.suites != '[]'
    runs-on: [self-hosted, linux, x64, hamnivo]
    timeout-minutes: 150
    strategy:
      # Every suite reports, so one push shows all that is broken.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.suites) }}
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      # Turbo's cache on the runner's cache volume, so a run reuses the builds of earlier runs:
      # the checkout's own .turbo is cleaned with the checkout.
      TURBO_CACHE_DIR: /home/runner/.cache/hamnivo-turbo
      HAMNIVO_CI_SUITE: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v7
        id: checkout

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browsers live in the runner's cache; their system libraries are installed once when the
      # runner is set up (docs/self-hosting.md, "Run the checks on GitHub, for free").
      # WebKit too: the widget journey runs WebKit and iPhone projects beside Chromium.
      - name: Install Chromium and WebKit for the browser checks
        if: matrix.browsers
        run: pnpm --filter @hamnivo/console exec playwright install chromium webkit

      # A run whose runner died never ran its cleanup: its databases, Chatwoot and smoke stacks stay
      # in the runner's Docker and hold the next run's 4 GB (ADR 0019). Only the checks' own names
      # are removed. What the runner has left is printed, so a run that dies leaves evidence.
      - name: Remove what a killed run left behind
        run: |
          command -v docker >/dev/null || exit 0
          pattern='^(hamnivo-check-|hamnivo-smoke-|hamnivo-autodeploy-|hamnivo-https-test)'
          mapfile -t containers < <(docker ps -a --format '{{.Names}}' | grep -E "$pattern" || true)
          if ((${#containers[@]})); then
            printf 'Removing container %s\n' "${containers[@]}"
            docker rm -f -v "${containers[@]}" >/dev/null
          fi
          mapfile -t volumes < <(docker volume ls -q | grep -E "$pattern" || true)
          if ((${#volumes[@]})); then
            printf 'Removing volume %s\n' "${volumes[@]}"
            docker volume rm "${volumes[@]}" >/dev/null || true
          fi
          mapfile -t networks < <(docker network ls --format '{{.Name}}' | grep -E "$pattern" || true)
          if ((${#networks[@]})); then
            printf 'Removing network %s\n' "${networks[@]}"
            docker network rm "${networks[@]}" >/dev/null || true
          fi
          echo 'Containers still running:'
          docker ps --format '  {{.Names}} ({{.Status}})'
          free -m || true
          for file in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
            if [[ -r "$file" ]]; then echo "$file: $(cat "$file")"; fi
          done

      - name: Checks
        env:
          SUITE_ARGS: ${{ matrix.args }}
          PG_VERSIONS: ${{ matrix.pg }}
        # SUITE_ARGS is unquoted on purpose: it holds several options.
        run: pnpm ci:local $SUITE_ARGS

      - name: Keep results on the compute runner
        if: always() && steps.checkout.outcome == 'success'
        run: bash scripts/ci/archive-results.sh

      # Only what the smoke tests leave behind; the runner keeps its other images and caches. The
      # pnpm store on the runner's disk keeps only the packages this checkout links to, and turbo's
      # cache a week of builds.
      - name: Free disk
        if: always()
        run: |
          docker image rm hamnivo/gateway:smoke hamnivo/edge:smoke \
            hamnivo/gateway:unlabelled hamnivo/edge:unlabelled >/dev/null 2>&1 || true
          docker image prune -f >/dev/null
          docker builder prune -f --filter until=168h >/dev/null
          pnpm store prune >/dev/null 2>&1 || true
          find "$TURBO_CACHE_DIR" -type f -mmin +$((7 * 1440)) -delete 2>/dev/null || true
