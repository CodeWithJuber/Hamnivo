# The check pipeline (ADR 0021): the same `pnpm ci:local` anyone can run, split into suites that run
# side by side, one job each, on GitHub-hosted runners, which cost nothing for a public repository.
# scripts/ci/plan.mjs picks the suites, and every run lints:
# - A pull request gets typecheck and unit tests on the packages its change reaches, the integration
#   tests on PostgreSQL 18, and the other suites the change reaches (Chatwoot, accessibility, the
#   widget, Studio in three parts, the website). A change to Markdown or docs/ alone gets only the
#   basics. It never runs a smoke test: they build the production images.
# - A push to main (a merge) gets the suites reached since the last commit main passed, so a suite
#   that failed runs again on the next merge, typecheck and unit tests on every package, and the
#   smoke tests when a deploy file changed.
# - The weekly run and a run by hand cover everything: PostgreSQL 16 and 18 and both smoke tests.
#   For a full check of a branch: gh workflow run ci.yml --ref <branch>.
# scripts/ci/public-repo-guard.sh runs first: no self-hosted or larger runner, and no workflow that
# would run a pull request's code with write access.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # Everything, every Saturday at 23:00 UTC: the safety net for what a selection missed
  # (PostgreSQL 16, a change the package graph does not see) and the smoke tests.
  schedule:
    - cron: '0 23 * * 6'

# A newer push to a pull request cancels its older run. Runs on main queue instead, so every merge
# is checked; the weekly run has a group of its own.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'weekly' || github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  guard:
    name: Workflows are safe for a public repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the workflows
        run: bash scripts/ci/public-repo-guard.sh

  plan:
    name: Pick the suites
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The last commit main passed is read from the list of this workflow's runs.
    permissions:
      actions: read
      contents: read
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Only pull requests and pushes install, so only they cache: on a manual or weekly run the
      # pnpm store does not exist, and setup-node's post step fails the job when its path is missing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'pnpm' || '' }}

      # Turbo, whose package graph places a change. If this fails, every suite runs.
      - name: Install dependencies
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      # Main is compared with the last commit a run of this workflow passed on main (GitHub's record
      # of its runs), not only with main before the push: a suite that failed on one merge runs
      # again on the next until it passes. When the lookup fails, BASE stays empty and main runs
      # everything.
      - name: Find the last commit main passed
        id: green
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/ci.yml/runs
        run: |
          set -euo pipefail
          sha=$(curl -fsS --retry 2 --get -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" -d branch=main -d status=success \
              -d exclude_pull_requests=true -d per_page=100 "$RUNS" \
            | node scripts/ci/plan.mjs --last-passed)
          echo "base=$sha" >> "$GITHUB_OUTPUT"
          echo "Compared with $sha, the last commit this workflow passed on main."

      - name: Pick the suites
        id: pick
        env:
          GREEN: ${{ steps.green.outputs.base }}
        run: |
          # Main: the last commit it passed (empty when not found: everything). A pull request: main.
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then export BASE="$GREEN"; else export BASE=origin/main; fi
          echo "suites=$(node scripts/ci/plan.mjs)" >> "$GITHUB_OUTPUT"

  checks:
    name: ${{ matrix.name }}
    needs: plan
    # An empty matrix is an error.
    if: needs.plan.outputs.suites != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      # Every suite reports, so one run shows all that is broken.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.suites) }}
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      HAMNIVO_CI_SUITE: ${{ matrix.id }}
      # A standard runner has 4 CPUs and 16 GB. Four turbo tasks at once, each package's unit tests
      # with their share of the CPUs (scripts/ci/local.sh), and two type checks or builds at once.
      HAMNIVO_CI_CONCURRENCY: '4'
      HAMNIVO_CI_HEAVY_CONCURRENCY: '2'
    steps:
      # The basics of a pull request compare it with origin/main (--affected), which needs the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          fetch-depth: ${{ contains(matrix.args, '--affected') && '0' || '1' }}
          persist-credentials: false

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The basics lint the shell scripts; `pnpm ci:local` skips shellcheck when it is missing.
      - name: Install shellcheck
        if: matrix.id == 'basics'
        run: |
          command -v shellcheck >/dev/null && exit 0
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends shellcheck

      # Chromium and WebKit with their system libraries: the widget journey runs WebKit and iPhone
      # projects beside Chromium.
      - name: Install Chromium and WebKit for the browser checks
        if: matrix.browsers
        run: pnpm --filter @hamnivo/console exec playwright install --with-deps chromium webkit

      - name: Checks
        env:
          SUITE_ARGS: ${{ matrix.args }}
          PG_VERSIONS: ${{ matrix.pg }}
        # SUITE_ARGS is unquoted on purpose: it holds several options.
        run: pnpm ci:local $SUITE_ARGS

      # The report goes into the run summary; test-results/ becomes an artifact, kept 14 days.
      - name: Keep the results
        id: results
        if: always() && steps.checkout.outcome == 'success'
        run: bash scripts/ci/archive-results.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.results.outputs.archive != ''
        with:
          name: ci-results-${{ matrix.id }}
          path: ${{ steps.results.outputs.archive }}
          retention-days: 14
          if-no-files-found: ignore

  # One status to require before merging, whatever suites the plan picked.
  result:
    name: checks
    needs: [guard, plan, checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            # A plan that picks no suite leaves checks skipped.
            [[ "$result" == success || "$result" == skipped ]] || exit 1
          done
          [[ "$RESULTS" == *success* ]]
