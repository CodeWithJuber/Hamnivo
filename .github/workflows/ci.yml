# The full check pipeline (ADR 0009): the same `pnpm ci:local` a server runs, with the production
# and automatic-deploy smoke tests. It runs on our own runner (deploy/ci-runner) and uses nothing
# GitHub bills for (ADR 0020): dependencies are cached on the runner's disk, and each report is
# kept there as a file, never uploaded as an artifact. scripts/ci/no-github-billing.sh checks this.
name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same branch replaces a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: [self-hosted, linux, x64, hamnivo]
    timeout-minutes: 150
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        id: checkout

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browsers live in the runner's cache; their system libraries are installed once when the
      # runner is set up (docs/self-hosting.md, "Run the checks on GitHub, for free").
      - name: Install Chromium and WebKit for the browser checks
        run: pnpm --filter @hamnivo/console exec playwright install chromium webkit

      # A run whose runner died never ran its cleanup: its databases, Chatwoot and smoke stacks stay
      # in the runner's Docker and hold the next run's 4 GB (ADR 0019). Only the checks' own names
      # are removed. What the runner has left is printed, so a run that dies leaves evidence.
      - name: Remove what a killed run left behind
        run: |
          command -v docker >/dev/null || exit 0
          pattern='^(hamnivo-check-|hamnivo-smoke-|hamnivo-autodeploy-|hamnivo-https-test)'
          mapfile -t containers < <(docker ps -a --format '{{.Names}}' | grep -E "$pattern" || true)
          if ((${#containers[@]})); then
            printf 'Removing container %s\n' "${containers[@]}"
            docker rm -f -v "${containers[@]}" >/dev/null
          fi
          mapfile -t volumes < <(docker volume ls -q | grep -E "$pattern" || true)
          if ((${#volumes[@]})); then
            printf 'Removing volume %s\n' "${volumes[@]}"
            docker volume rm "${volumes[@]}" >/dev/null || true
          fi
          mapfile -t networks < <(docker network ls --format '{{.Name}}' | grep -E "$pattern" || true)
          if ((${#networks[@]})); then
            printf 'Removing network %s\n' "${networks[@]}"
            docker network rm "${networks[@]}" >/dev/null || true
          fi
          echo 'Containers still running:'
          docker ps --format '  {{.Names}} ({{.Status}})'
          free -m || true
          for file in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
            if [[ -r "$file" ]]; then echo "$file: $(cat "$file")"; fi
          done

      - name: Checks
        run: pnpm ci:local --with-production --with-autodeploy

      - name: Keep results on the compute runner
        if: always() && steps.checkout.outcome == 'success'
        run: bash scripts/ci/archive-results.sh

      # Only what the smoke tests leave behind; the runner keeps its other images and caches. The
      # pnpm store on the runner's disk keeps only the packages this checkout links to.
      - name: Free disk
        if: always()
        run: |
          docker image rm hamnivo/gateway:smoke hamnivo/edge:smoke \
            hamnivo/gateway:unlabelled hamnivo/edge:unlabelled >/dev/null 2>&1 || true
          docker image prune -f >/dev/null
          docker builder prune -f --filter until=168h >/dev/null
          pnpm store prune >/dev/null 2>&1 || true
