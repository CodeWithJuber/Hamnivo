# The contributor licence agreement (CLA.md). Every author of a pull request's commits signs it once,
# by replying with the sentence the check asks for. The signatures are kept in the branch
# `cla-signatures` (signatures/version1/cla.json), which must exist and must not be protected.
# The owner and bots need not sign.
#
# This is the one workflow that uses pull_request_target: a fork's pull request gets a read-only
# token on pull_request, and the check must comment, set its status and record signatures. It never
# checks out or runs the pull request's code, and scripts/ci/public-repo-guard.sh fails it if it
# ever does.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read

jobs:
  cla:
    name: CLA
    # A comment counts only on a pull request, and only when it signs or asks for a recheck.
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.user.login != 'CodeWithJuber') ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check that every author signed
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/CodeWithJuber/Hamnivo/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: CodeWithJuber,*[bot]
