# Publishes @hamnivo/react or @hamnivo/vue to npm. It runs only when a tag is pushed, never on a
# branch:
#
#   react-v0.1.0   publishes @hamnivo/react 0.1.0, from packages/react
#   vue-v0.1.0     publishes @hamnivo/vue 0.1.0, from packages/vue
#
# The version in the tag must be the version in that package's package.json, so bump the version
# first, merge it, then tag that commit. A version with a dash in it (0.2.0-beta.1) is published
# under the npm tag "next", and never becomes "latest".
#
# It publishes with npm's trusted publishing (ADR 0021): npm trusts this workflow through a
# short-lived OIDC token from GitHub, so there is no npm token to store, leak or rotate, and every
# version gets a signed provenance statement that links it to this repository and run. Once per
# package, on npmjs.com, the package's Settings → Trusted publishing names GitHub Actions with the
# owner CodeWithJuber, the repository Hamnivo, the workflow release-packages.yml and the
# environment npm. The repository's environment `npm` (Settings → Environments) can require a
# reviewer before anything is published.
name: Release packages

on:
  push:
    tags:
      - 'react-v*'
      - 'vue-v*'

# Two pushes of the same tag do not publish at the same time, and a running publish is never cut.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    environment: npm
    timeout-minutes: 45
    permissions:
      contents: read
      # The OIDC token npm's trusted publishing and the provenance statement need.
      id-token: write
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No dependency cache in a job that publishes: nothing another run saved can reach the package.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The tag is read from the environment, never put into the script text.
      - name: Work out which package the tag is for
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG%%-v*}"
          version="${TAG#*-v}"
          case "$name" in
            react | vue) ;;
            *)
              echo "::error::The tag '$TAG' is not react-v<version> or vue-v<version>."
              exit 1
              ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version', in the tag '$TAG', is not a version like 1.2.3 or 1.2.3-beta.1."
            exit 1
          fi
          actual="$(node -p "require('./packages/$name/package.json').version")"
          if [ "$actual" != "$version" ]; then
            echo "::error::The tag says $version, but packages/$name/package.json says $actual. Change one of them."
            exit 1
          fi
          if [ "$(node -p "require('./packages/$name/package.json').private === true")" = "true" ]; then
            echo "::error::packages/$name is marked private, so it cannot be published."
            exit 1
          fi
          {
            echo "filter=@hamnivo/$name"
            echo "dir=packages/$name"
            echo "version=$version"
            if [[ "$version" == *-* ]]; then
              echo "npm_tag=next"
            else
              echo "npm_tag=latest"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Check that npm can publish with trusted publishing
        # Trusted publishing needs npm 11.5.1 or later; Node 24 brings one.
        run: |
          version="$(npm --version)"
          IFS=. read -r major minor patch <<<"${version%%-*}"
          if ((major < 11 || (major == 11 && (minor < 5 || (minor == 5 && patch < 1))))); then
            echo "::error::npm $version cannot use trusted publishing, which needs npm 11.5.1 or later."
            exit 1
          fi
          echo "npm $version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, type-check and test the package
        # Only the package that is released, and what it needs. Its test script builds it first.
        env:
          DIR: ${{ steps.package.outputs.dir }}
          FILTER: ${{ steps.package.outputs.filter }}
        run: |
          pnpm exec biome check "$DIR"
          pnpm exec turbo run typecheck test --filter="$FILTER" --concurrency=1

      - name: Publish to npm
        # pnpm packs the package, turning its workspace: ranges into versions, and npm publishes
        # the file with trusted publishing and a provenance statement.
        env:
          FILTER: ${{ steps.package.outputs.filter }}
          VERSION: ${{ steps.package.outputs.version }}
          NPM_TAG: ${{ steps.package.outputs.npm_tag }}
        run: |
          if npm view "$FILTER@$VERSION" version > /dev/null 2>&1; then
            echo "$FILTER@$VERSION is already on npm. Nothing to publish."
            exit 0
          fi
          folder="$(mktemp -d "$RUNNER_TEMP/package.XXXXXX")"
          pnpm --filter "$FILTER" pack --pack-destination "$folder"
          tarball="$(find "$folder" -maxdepth 1 -name '*.tgz' -print -quit)"
          npm publish "$tarball" --provenance --access public --tag "$NPM_TAG"
