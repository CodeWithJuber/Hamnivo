# Weekly updates, grouped so that each week brings a few pull requests instead of dozens. Major
# versions come one at a time, since they can break things.
version: 2
updates:
  # The pnpm workspace: every package.json, the catalog in pnpm-workspace.yaml and pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Etc/UTC
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
