name: Bug report
description: Something in Hamnivo does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. Please search the open issues first. A security problem goes to a
        [private report](https://github.com/CodeWithJuber/Hamnivo/security/advisories/new), not here.
        Remove passwords, keys, customer names and email addresses from anything you paste.
  - type: dropdown
    id: area
    attributes:
      label: Where is the problem?
      options:
        - Chat widget or its loader
        - Studio (staff console)
        - Gateway API or worker
        - SDK (server, client, React or Vue)
        - Plugin or integration (WordPress, WHMCS, Shopify, GTM, PHP)
        - Deployment and operations (deploy/, hamnivo.sh)
        - Documentation or website
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you run (`git rev-parse --short HEAD`), or the npm package version.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, Node.js and Docker versions, as far as they matter.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: '`hamnivo.sh logs` or the browser console, with secrets removed.'
      render: text
