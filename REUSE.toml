# Licence and copyright of every file, for REUSE (https://reuse.software). `reuse lint` checks it,
# and LICENSES/ holds each licence named here. NOTICE explains in words which parts are not
# AGPL-3.0-only and why. When several annotations match a file, the last one wins, so the
# general rule comes first.
version = 1
SPDX-PackageName = "Hamnivo"
SPDX-PackageSupplier = "Juber Shaikh (Hostlelo)"
SPDX-PackageDownloadLocation = "https://github.com/CodeWithJuber/Hamnivo"

# Everything not named below.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Juber Shaikh (Hostlelo)"
SPDX-License-Identifier = "AGPL-3.0-only"

# Code that runs inside other people's software keeps a permissive licence (NOTICE).
[[annotations]]
path = [
  "packages/server-sdk/**",
  "packages/client/**",
  "packages/react/**",
  "packages/vue/**",
  "packages/contracts/**",
  "packages/widget-loader/**",
  # The widget loader bundles this file's browser rules.
  "packages/domain/src/automations/index.ts",
  "integrations/php-sdk/**",
  "integrations/wordpress/**",
  "integrations/whmcs/**",
  "integrations/shopify/**",
  "examples/**",
]
SPDX-FileCopyrightText = "2026 Juber Shaikh (Hostlelo)"
SPDX-License-Identifier = "MIT"

# The Community Template Gallery of Google Tag Manager requires Apache 2.0.
[[annotations]]
path = "integrations/gtm/**"
SPDX-FileCopyrightText = "2026 Juber Shaikh (Hostlelo)"
SPDX-License-Identifier = "Apache-2.0"

# Third-party material (NOTICE).
[[annotations]]
path = ["apps/widget/public/fonts/dm-sans-latin.woff2", "apps/widget/public/fonts/DM-Sans-LICENSE.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2014 The DM Sans Project Authors (https://github.com/googlefonts/dm-fonts)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["apps/widget/public/fonts/noto-sans-latin.woff2", "apps/widget/public/fonts/Noto-Sans-LICENSE.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts)"
SPDX-License-Identifier = "OFL-1.1"

# Diagrams made with Archify carry its styles.
[[annotations]]
path = "docs/blueprint/diagrams/*.svg"
SPDX-FileCopyrightText = [
  "2026 Juber Shaikh (Hostlelo)",
  "2026 tt-a1i (Archify)",
  "2025 Cocoon AI",
]
SPDX-License-Identifier = "AGPL-3.0-only AND MIT"

[[annotations]]
path = ["docs/blueprint/diagrams/LICENSE-Archify.txt", "docs/blueprint/diagrams/THIRD-PARTY-NOTICES-Archify.md"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 tt-a1i (Archify)", "2025 Cocoon AI"]
SPDX-License-Identifier = "MIT"

# Chatwoot's API description, vendored from v4.18.0, and the types generated from it.
[[annotations]]
path = ["packages/chatwoot/swagger/v4.18.0/**", "packages/chatwoot/src/generated/**"]
precedence = "override"
SPDX-FileCopyrightText = "2017-2026 Chatwoot Inc."
SPDX-License-Identifier = "MIT"

